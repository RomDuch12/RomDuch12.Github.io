name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (codes, dessins, lecteur SimPL, outils, traductions)
        run: node --test tests/*.test.mjs

  # Copie du site sur vectordrive.fr (hébergement OVH) après les tests, à chaque envoi sur main.
  # Identifiants FTP dans Settings > Secrets and variables > Actions : OVH_FTP_SERVEUR, OVH_FTP_UTILISATEUR, OVH_FTP_MOT_DE_PASSE.
  # GitHub Pages (romduch12.github.io) reste publié comme avant.
  ovh:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: ovh
    steps:
      - uses: actions/checkout@v4
      - name: Identifiants présents ?
        id: ident
        env:
          SERVEUR: ${{ secrets.OVH_FTP_SERVEUR }}
        run: echo "ok=$([ -n "$SERVEUR" ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"
      - name: Envoi FTP vers vectordrive.fr
        if: steps.ident.outputs.ok == 'oui'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVEUR }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
          protocol: ftps
          server-dir: www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            Programmes/**
            googlefeab245c91ce1fc1.html
      - name: Identifiants absents
        if: steps.ident.outputs.ok != 'oui'
        run: echo '::notice::Secrets OVH_FTP_* absents, envoi vers vectordrive.fr sauté.'
